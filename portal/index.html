<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MCDR Settlement Portal — submit, track, and settle capital-meeting requests." />
  <title>MCDR Settlement Portal</title>

  <!-- Favicon (inline SVG: scale/justice glyph) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 6l9-3 9 3'/%3E%3Cpath d='M3 6v2l9 3 9-3V6'/%3E%3Cpath d='M5 10v8m14-8v8M2 22h20M9 22v-4m6 4v-4'/%3E%3C/svg%3E" />

  <!-- Tailwind Play CDN (no build step) + custom theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
              800: '#075985', 900: '#0c4a6e'
            },
            ink: {
              900: '#0b1120', 850: '#0f172a', 800: '#111c33',
              700: '#1e293b', 600: '#273549', 500: '#334155'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          },
          boxShadow: {
            glass: '0 8px 32px rgba(2, 6, 23, 0.45)',
            glow: '0 0 0 1px rgba(56,189,248,0.25), 0 8px 30px rgba(56,189,248,0.15)'
          },
          keyframes: {
            'fade-in': { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            'slide-up': { '0%': { opacity: 0, transform: 'translateY(12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            'slide-down': { '0%': { opacity: 0, transform: 'translateY(-12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            'scale-in': { '0%': { opacity: 0, transform: 'scale(0.96)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
            shimmer: { '100%': { transform: 'translateX(100%)' } }
          },
          animation: {
            'fade-in': 'fade-in 0.3s ease-out',
            'slide-up': 'slide-up 0.35s cubic-bezier(0.16,1,0.3,1)',
            'slide-down': 'slide-down 0.25s ease-out',
            'scale-in': 'scale-in 0.2s ease-out'
          }
        }
      }
    };
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- App styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen bg-ink-900 text-slate-200 font-sans antialiased selection:bg-brand-500/30">

  <!-- Ambient background gradient orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- ============ ROOT ============ -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col">

    <!-- ---------- AUTH VIEW ---------- -->
    <section id="auth-view" class="flex-1 flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md animate-slide-up">

        <!-- Brand header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-glow mb-4">
            <svg class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6l9-3 9 3" /><path d="M3 6v2l9 3 9-3V6" /><path d="M5 10v8m14-8v8M2 22h20M9 22v-4m6 4v-4" />
            </svg>
          </div>
          <h1 class="text-2xl font-extrabold tracking-tight text-white">MCDR Settlement</h1>
          <p class="text-sm text-slate-400 mt-1">Capital meeting settlement portal</p>
        </div>

        <!-- Auth card -->
        <div class="glass-card p-7 sm:p-8">

          <!-- Tabs -->
          <div class="flex p-1 bg-ink-700/60 rounded-xl mb-6" role="tablist">
            <button id="tab-login" class="auth-tab flex-1 py-2.5 rounded-lg text-sm font-semibold transition" role="tab">Sign in</button>
            <button id="tab-register" class="auth-tab flex-1 py-2.5 rounded-lg text-sm font-semibold transition" role="tab">Register</button>
          </div>

          <!-- LOGIN -->
          <form id="login-form" class="space-y-4" autocomplete="on">
            <div>
              <label for="login-username" class="block text-xs font-semibold text-slate-300 mb-1.5">Username or email</label>
              <input id="login-username" name="username" type="text" required autocomplete="username"
                class="form-input" placeholder="owner1" />
            </div>
            <div>
              <label for="login-password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
              <div class="relative">
                <input id="login-password" name="password" type="password" required autocomplete="current-password"
                  class="form-input pr-11" placeholder="••••••••" />
                <button type="button" data-toggle-pwd="login-password" class="pwd-toggle" aria-label="Show password">
                  <svg class="eye-open w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68M6.06 6.06A13.16 13.16 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 4.06-.94M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <p id="login-error" class="hidden text-sm text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2"></p>
            <button id="login-submit" type="submit" class="btn-primary w-full justify-center">
              <span class="btn-label">Sign in</span>
              <span class="btn-spinner hidden"></span>
            </button>
          </form>

          <!-- REGISTER -->
          <form id="register-form" class="space-y-4 hidden" autocomplete="on">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="reg-firstName" class="block text-xs font-semibold text-slate-300 mb-1.5">First name</label>
                <input id="reg-firstName" name="firstName" type="text" required minlength="3" autocomplete="given-name" class="form-input" placeholder="John" />
              </div>
              <div>
                <label for="reg-lastName" class="block text-xs font-semibold text-slate-300 mb-1.5">Last name</label>
                <input id="reg-lastName" name="lastName" type="text" required minlength="3" autocomplete="family-name" class="form-input" placeholder="Doe" />
              </div>
            </div>
            <div>
              <label for="reg-email" class="block text-xs font-semibold text-slate-300 mb-1.5">Email</label>
              <input id="reg-email" name="email" type="email" required autocomplete="email" class="form-input" placeholder="you@example.com" />
            </div>
            <div>
              <label for="reg-password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password <span class="text-slate-500 font-normal">(min 6 chars)</span></label>
              <div class="relative">
                <input id="reg-password" name="password" type="password" required minlength="6" autocomplete="new-password" class="form-input pr-11" placeholder="••••••••" />
                <button type="button" data-toggle-pwd="reg-password" class="pwd-toggle" aria-label="Show password">
                  <svg class="eye-open w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68M6.06 6.06A13.16 13.16 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 4.06-.94M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <p id="register-error" class="hidden text-sm text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2"></p>
            <p id="register-success" class="hidden text-sm text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-lg px-3 py-2"></p>
            <button id="register-submit" type="submit" class="btn-primary w-full justify-center">
              <span class="btn-label">Create owner account</span>
              <span class="btn-spinner hidden"></span>
            </button>
            <p class="text-xs text-slate-500 text-center">New accounts are created with the <strong class="text-slate-400">owner</strong> role.</p>
          </form>
        </div>

        <!-- Demo hint -->
        <div class="mt-6 text-center text-xs text-slate-500">
          <p>Demo users (password <code class="text-brand-300">test123</code>):</p>
          <p class="mt-1"><code class="text-slate-400">owner1</code> · <code class="text-slate-400">owner2</code> · <code class="text-slate-400">backoffice1</code> · <code class="text-slate-400">backoffice2</code></p>
        </div>
      </div>
    </section>

    <!-- ---------- APP SHELL (hidden until authenticated) ---------- -->
    <div id="app-shell" class="hidden flex-1 flex flex-col">

      <!-- Header -->
      <header class="sticky top-0 z-40 backdrop-blur-xl bg-ink-900/70 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3">

          <!-- Logo + nav (left) -->
          <a href="#/" class="flex items-center gap-2.5 shrink-0" data-nav="home">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-glow">
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9-3 9 3" /><path d="M3 6v2l9 3 9-3V6" /><path d="M5 10v8m14-8v8M2 22h20M9 22v-4m6 4v-4" /></svg>
            </span>
            <span class="font-extrabold text-white tracking-tight hidden sm:block">MCDR</span>
          </a>

          <!-- Role-aware nav -->
          <nav id="main-nav" class="hidden md:flex items-center gap-1 ml-4"></nav>

          <!-- Mobile menu button -->
          <button id="mobile-menu-btn" class="md:hidden ml-auto p-2 rounded-lg hover:bg-white/5 text-slate-300" aria-label="Menu">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <!-- Right cluster -->
          <div class="hidden md:flex items-center gap-2 ml-auto">
            <!-- Notification bell -->
            <div class="relative">
              <button id="notif-bell" class="relative p-2 rounded-lg hover:bg-white/5 text-slate-300 transition" aria-label="Notifications">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <span id="notif-badge" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center hidden">0</span>
              </button>
              <!-- Notification dropdown -->
              <div id="notif-panel" class="notif-panel hidden absolute right-0 mt-2 w-80 sm:w-96 origin-top-right"></div>
            </div>

            <!-- User menu -->
            <div class="relative">
              <button id="user-menu-btn" class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-lg hover:bg-white/5 transition">
                <span id="user-avatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 text-white text-sm font-bold flex items-center justify-center">?</span>
                <span class="text-sm font-medium text-slate-200 max-w-[120px] truncate hidden lg:block" id="user-name">—</span>
                <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="user-menu" class="user-menu hidden absolute right-0 mt-2 w-56 origin-top-right"></div>
            </div>
          </div>
        </div>

        <!-- Mobile nav drawer -->
        <div id="mobile-nav" class="md:hidden hidden border-t border-white/5 bg-ink-850/95 backdrop-blur-xl px-4 py-3 space-y-1"></div>
      </header>

      <!-- Main content -->
      <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8"></main>

      <!-- Footer -->
      <footer class="border-t border-white/5 bg-ink-900/50 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
          <p>© <span id="footer-year"></span> MCDR Settlement — All rights reserved.</p>
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5">
              API
              <span id="health-dot" class="health-dot unknown"></span>
              <span id="health-text" class="text-slate-400">checking…</span>
            </span>
            <span class="hidden sm:inline">v1.0</span>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- ============ MODAL ROOT ============ -->
  <div id="modal-root" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="modal-backdrop fixed inset-0 bg-black/60 backdrop-blur-sm animate-fade-in" data-close-modal></div>
    <div class="relative min-h-screen flex items-start sm:items-center justify-center p-4">
      <div id="modal-card" class="modal-card glass-card w-full max-w-lg my-8 animate-scale-in">
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- ============ TOAST ROOT ============ -->
  <div id="toast-root" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm pointer-events-none"></div>

  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
