services:
  api:
    build: .
    container_name: mcdr-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/mcdr
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=mcdr
      - KEYCLOAK_CLIENT_ID=mcdr-api
      - KEYCLOAK_CLIENT_SECRET=secret
      - KEYCLOAK_ISSUER=http://localhost:8081/realms/mcdr
      - FILE_STORAGE_PATH=/app/uploads
      - MAX_UPLOAD_SIZE_MB=10
      - PAGINATION_DEFAULT_LIMIT=20
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
      - SETTLED_CRNS=
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: mcdr-mongo
    ports:
      # Host 27017 is shadowed by a stray local mongod bound to 127.0.0.1:27017,
      # so reach this container on host port 27018 (e.g. Compass -> localhost:27018).
      # The API connects internally via `mongo:27017` and is unaffected.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mcdr-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_URL=http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /realms/master HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n" >&3; head -n1 <&3 | grep -q "200"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mongo-data:
  uploads:
